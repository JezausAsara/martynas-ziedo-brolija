name: Rebuild enemy artwork
on:
  push:
    paths:
      - 'assets/rpg/hq-source/**'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild high quality WebP assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          e1=(assets/rpg/hq-source/e1hq-*.txt)
          e2=(assets/rpg/hq-source/e2-*.txt)
          e3=(assets/rpg/hq-source/e3-*.txt)
          f1=(assets/rpg/hq-source/f1-*.txt)
          f2=(assets/rpg/hq-source/f2-*.txt)
          # Enemy #4 is a finished full-card asset and is intentionally NOT rebuilt here.
          if [ "${#e1[@]}" -ne 14 ] || [ "${#e2[@]}" -ne 17 ] || [ "${#e3[@]}" -ne 15 ] || [ "${#f1[@]}" -ne 1 ] || [ "${#f2[@]}" -ne 1 ]; then
            echo "Waiting for all HQ chunks: e1=${#e1[@]}/14 e2=${#e2[@]}/17 e3=${#e3[@]}/15 f1=${#f1[@]}/1 f2=${#f2[@]}/1"
            exit 0
          fi
          cat "${e1[@]}" | tr -d '\n\r' | base64 -d > assets/rpg/enemy1-legionierius.webp
          cat "${e2[@]}" | tr -d '\n\r' | base64 -d > assets/rpg/enemy2-olympiakos.webp
          cat "${e3[@]}" | tr -d '\n\r' | base64 -d > assets/rpg/enemy3-paris.webp
          cat "${f1[@]}" | tr -d '\n\r' | base64 -d > assets/rpg/farm1-zaliasis-jesteris.webp
          cat "${f2[@]}" | tr -d '\n\r' | base64 -d > assets/rpg/farm2-taures-karalius.webp
          echo "Enemy 1 bytes: $(stat -c%s assets/rpg/enemy1-legionierius.webp)"
          echo "Enemy 2 bytes: $(stat -c%s assets/rpg/enemy2-olympiakos.webp)"
          echo "Enemy 3 bytes: $(stat -c%s assets/rpg/enemy3-paris.webp)"
          echo "Farm 1 bytes: $(stat -c%s assets/rpg/farm1-zaliasis-jesteris.webp)"
          echo "Farm 2 bytes: $(stat -c%s assets/rpg/farm2-taures-karalius.webp)"
          file assets/rpg/enemy1-legionierius.webp
          file assets/rpg/enemy2-olympiakos.webp
          file assets/rpg/enemy3-paris.webp
          file assets/rpg/farm1-zaliasis-jesteris.webp
          file assets/rpg/farm2-taures-karalius.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rpg/enemy1-legionierius.webp assets/rpg/enemy2-olympiakos.webp assets/rpg/enemy3-paris.webp assets/rpg/farm1-zaliasis-jesteris.webp assets/rpg/farm2-taures-karalius.webp
          if git diff --cached --quiet; then
            echo "No binary changes."
          else
            git commit -m "Rebuild high quality enemy artwork"
            git push
          fi
